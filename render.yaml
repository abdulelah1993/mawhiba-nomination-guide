services:
  - type: web
    name: mawhiba-olympiad-guide
    runtime: static
    buildCommand: mkdir -p public && cp index.html public/index.html
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
