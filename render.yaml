services:
  - type: web
    name: mawhiba-nomination-guide
    runtime: static
    buildCommand: mkdir -p public && cp -R index.html styles.css app.js assets public/
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
