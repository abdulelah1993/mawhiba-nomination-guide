services:
  - type: web
    name: mawhiba-olympiad-guide
    runtime: static
    buildCommand: node build.js
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
